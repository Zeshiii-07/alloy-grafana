apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: alloy
      version: "0.6.0" # or your current chart version
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    controller:
      type: daemonset
    alloy:
      configMap:
        create: true
        # Reference your prometheus-only setup here
    # Disable loki receiver/exporter if not used in your values, e.g.:
    # If your values file maps environment variables from the secret:
    extraEnv:
      - name: PROMETHEUS_URL
        valueFrom:
          secretKeyRef:
            name: grafana-cloud-credentials
            key: prometheus_url
      - name: GRAFANA_USER
        valueFrom:
          secretKeyRef:
            name: grafana-cloud-credentials
            key: username
      - name: GRAFANA_TOKEN
        valueFrom:
          secretKeyRef:
            name: grafana-cloud-credentials
            key: token
